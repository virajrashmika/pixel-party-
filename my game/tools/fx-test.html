<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FX Test - Pixel Party</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Test page for js/fx.js: fills the whole window, keeps 16:9 */
html,body{margin:0;height:100%;background:#07060f;overflow:hidden}
body{display:grid;place-items:center}
canvas{display:block;cursor:crosshair}
</style>
</head>
<body>
<canvas id="c" aria-label="Effects test. Press 1 to 7, L, S or A, or click."></canvas>
<script src="../js/fx.js"></script>
<script>
(() => {
  const st = FX.stage(document.getElementById('c'), { width: 320, height: 180, fit: 'window' });
  const ctx = st.ctx, W = 320, H = 180;
  const P1 = '#ff7a59', P2 = '#4fd1e8', GOLD = '#f4c542', RED = '#ff4f6d', INK = '#f1ecff';
  let auto = true, autoT = 0;

  // ----- pre-drawn glowing shapes (made once, reused every frame) -----
  const ruler = () => FX.shape('ruler', 10, 70, g => {
    FX.roundRect(g, 0, 0, 10, 70, 2); g.fillStyle = GOLD; g.fill();
    g.fillStyle = '#3b2a10';
    for (let i = 1; i < 14; i++) g.fillRect(0, i * 5, i % 2 ? 3 : 6, 0.6);
  }, { color: GOLD, glow: 5 });
  const ring = c => FX.shape('ring' + c, 24, 24, g => {
    g.strokeStyle = c; g.lineWidth = 2; g.beginPath(); g.arc(12, 12, 10, 0, Math.PI * 2); g.stroke();
  }, { color: c, glow: 6 });
  const ball = c => FX.shape('ball' + c, 8, 8, g => {
    g.fillStyle = c; g.beginPath(); g.arc(4, 4, 4, 0, Math.PI * 2); g.fill();
  }, { color: c, glow: 5 });

  // ----- what each key does -----
  const rnd = () => ({ x: FX.rand(70, 250), y: FX.rand(50, 130) });
  const actions = {
    Digit1: () => { const p = rnd(); FX.sparks(p.x, p.y, { color: FX.pick([P1, P2, GOLD]), count: 24, speed: 160 }); FX.shake('small'); },
    Digit2: () => { const p = rnd(); FX.smoke(p.x, p.y, { count: 10 }); },
    Digit3: () => { const p = rnd(); boom(p.x, p.y); },
    Digit4: () => { FX.confetti(W / 2, H - 10, { count: 90 }); FX.confettiRain(0, W, 0, { colors: [P1, GOLD, INK] }); },
    Digit5: () => { const p = rnd(); FX.text(FX.pick(['+1', 'CRITICAL!', 'NITRO!', 'PARRY!', '213 MS']), p.x, p.y, { color: FX.pick([P1, P2, GOLD, RED]), size: 16 }); },
    Digit6: () => FX.shake('small'),
    Digit7: () => FX.flash('#ffffff', 0.18, 0.7),
    KeyL: () => FX.setLow(!FX.low),
    KeyA: () => { auto = !auto; },
    KeyS: () => { for (let i = 0; i < 30; i++) { const p = rnd(); FX.explosion(p.x, p.y, { color: FX.pick([P1, P2, GOLD, RED]) }); } }
  };
  function boom(x, y) {
    FX.explosion(x, y, { color: FX.pick([P1, P2, GOLD, RED]), size: 1.3 });
    FX.shake('big');
    FX.flash('#ffffff', 0.12, 0.35);
    FX.text('BOOM!', x, y - 10, { color: GOLD, size: 18, shake: 4 });
  }
  addEventListener('keydown', e => { if (actions[e.code]) { e.preventDefault(); actions[e.code](); } });
  st.canvas.addEventListener('pointerdown', e => { const p = st.toLogical(e.clientX, e.clientY); boom(p.x, p.y); });

  // ----- background: dark gradient + moving neon grid -----
  function background(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0818'); g.addColorStop(0.55, '#140f2e'); g.addColorStop(1, '#07060f');
    ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, H + 20);
    const horizon = 112;
    ctx.lineWidth = 0.6;
    for (let i = 0; i < 14; i++) {               // horizontal lines rushing towards you
      const k = ((i + (t * 0.6) % 1) / 14);
      const y = horizon + (H - horizon) * k * k;
      ctx.strokeStyle = FX.rgba('#b45cff', 0.15 + k * 0.45);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let i = -10; i <= 10; i++) {            // lines going to the vanishing point
      ctx.strokeStyle = FX.rgba('#b45cff', 0.25);
      ctx.beginPath(); ctx.moveTo(W / 2 + i * 4, horizon); ctx.lineTo(W / 2 + i * 44, H); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'lighter';    // soft glow along the horizon
    ctx.drawImage(FX.glowDot('#b45cff'), W / 2 - 160, horizon - 30, 320, 60);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ----- the animated demos -----
  function demos(t) {
    // easing demo: three balls race with different easings
    const names = ['outBack', 'outElastic', 'outBounce'], cols = [P1, P2, GOLD];
    names.forEach((n, i) => {
      const k = Math.min(1, (t % 2.4) / 1.4);
      const x = 16 + FX.ease[n](k) * 84, y = 28 + i * 16;
      ctx.strokeStyle = FX.rgba(INK, 0.15); ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(16, y); ctx.lineTo(100, y); ctx.stroke();
      FX.drawShape(ctx, ball(cols[i]), x, y);
      FX.drawText(ctx, n, 16, y - 7, { size: 6, color: FX.rgba(INK, 0.8), font: FX.FONT_BODY, glow: 0, align: 'left' });
    });
    // a ruler falling with motion blur (faded copies behind it)
    const fall = (t % 1.6) / 1.6, ry = 20 + FX.ease.inQuad(fall) * 90, speed = FX.ease.inQuad(fall + 0.02) - FX.ease.inQuad(fall);
    for (let i = 4; i >= 1; i--) FX.drawShape(ctx, ruler(), 160, ry - i * speed * 260, { ax: 0.5, ay: 0, alpha: 0.12 * (5 - i) / 4 });
    FX.drawShape(ctx, ruler(), 160, ry, { ax: 0.5, ay: 0 });
    // glowing rings that pulse
    const s = 1 + Math.sin(t * 4) * 0.12;
    FX.drawShape(ctx, ring(P1), 240, 50, { scale: s });
    FX.drawShape(ctx, ring(P2), 272, 50, { scale: 2.12 - s });
    FX.drawText(ctx, 'NEON ARCADE', 256, 82, { size: 12, color: P2, rot: Math.sin(t * 2) * 0.05 });
  }

  function hud() {
    st.steady();                                  // no shake for the info text
    const lines = [
      Math.round(FX.fps) + ' FPS   ' + FX.particles.count + ' PARTICLES',
      st.canvas.width + ' x ' + st.canvas.height + ' PX   DPR ' + st.dpr.toFixed(2),
      'LOW EFFECTS: ' + (FX.low ? 'ON' : 'OFF') + '   AUTO DEMO: ' + (auto ? 'ON' : 'OFF')
    ];
    ctx.font = FX.font(6, FX.FONT_BODY, 700); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    lines.forEach((l, i) => { ctx.fillStyle = i === 2 && FX.low ? GOLD : FX.rgba(INK, 0.85); ctx.fillText(l, W - 6, 6 + i * 8); });
    ctx.textAlign = 'center';
    ctx.fillStyle = FX.rgba(INK, 0.75);
    ctx.fillText('1 SPARKS · 2 SMOKE · 3 BOOM · 4 CONFETTI · 5 TEXT · 6 SHAKE · 7 FLASH', W / 2, H - 18);
    ctx.fillText('L LOW EFFECTS · S STRESS TEST · A AUTO DEMO · CLICK = BOOM', W / 2, H - 10);
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (auto && (autoT -= dt) <= 0) { autoT = 0.9; FX.pick([actions.Digit1, actions.Digit3, actions.Digit5, actions.Digit2])(); }
    FX.update(dt);
    st.begin();
    background(FX.time);
    demos(FX.time);
    FX.draw(ctx);
    hud();
    st.end();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
